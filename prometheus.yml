global:
  scrape_interval: 15s

scrape_configs:
  - job_name: users-service
    static_configs:
      - targets: ['users:8081']

  - job_name: accounts-service
    static_configs:
      - targets: ['accounts:8081']

  - job_name: transactions-service
    static_configs:
      - targets: ['transactions:8081']